<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="concBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="50%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#concBg)"/>

  <!-- Brutalist Architecture Perspective Forms -->
  <polygon points="40,800 240,160 360,160 560,800" fill="url(#beam)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <polygon points="120,800 270,300 330,300 480,800" fill="#080808" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Architectural Cantilevers -->
  <polygon points="0,320 280,240 280,280 0,420" fill="#222222" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <polygon points="600,320 320,240 320,280 600,420" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- High-contrast geometric cast shadows -->
  <polygon points="240,160 300,100 360,160" fill="#333333"/>
  
  <!-- Grain & Line Accent -->
  <line x1="300" y1="0" x2="300" y2="800" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="8 8"/>
  <text x="300" y="740" fill="#ffffff" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">BRUTALIST MONOLITH // 01</text>
</svg>
