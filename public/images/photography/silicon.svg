<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="silBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#silBg)"/>

  <!-- Center Die / BGA Package -->
  <rect x="180" y="280" width="240" height="240" rx="8" fill="#1b1b22" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="220" y="320" width="160" height="160" rx="4" fill="#0b0b0e" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="300" cy="400" r="32" fill="#252530" stroke="#ffffff" stroke-opacity="0.4"/>

  <!-- High-Density Circuit Bus Traces (Monochrome Gold/White) -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <!-- North traces -->
    <path d="M220,280 L220,180 L140,100"/>
    <path d="M260,280 L260,140 L200,80"/>
    <path d="M300,280 L300,80"/>
    <path d="M340,280 L340,140 L400,80"/>
    <path d="M380,280 L380,180 L460,100"/>

    <!-- South traces -->
    <path d="M220,520 L220,620 L140,700"/>
    <path d="M260,520 L260,660 L200,720"/>
    <path d="M300,520 L300,720"/>
    <path d="M340,520 L340,660 L400,720"/>
    <path d="M380,520 L380,620 L460,700"/>

    <!-- West traces -->
    <path d="M180,340 L80,340 L40,300"/>
    <path d="M180,400 L60,400"/>
    <path d="M180,460 L80,460 L40,500"/>

    <!-- East traces -->
    <path d="M420,340 L520,340 L560,300"/>
    <path d="M420,400 L540,400"/>
    <path d="M420,460 L520,460 L560,500"/>
  </g>

  <!-- Surface Mount Vias -->
  <g fill="#ffffff" fill-opacity="0.3">
    <circle cx="140" cy="100" r="3"/>
    <circle cx="200" cy="80" r="3"/>
    <circle cx="300" cy="80" r="3"/>
    <circle cx="400" cy="80" r="3"/>
    <circle cx="460" cy="100" r="3"/>

    <circle cx="140" cy="700" r="3"/>
    <circle cx="200" cy="720" r="3"/>
    <circle cx="300" cy="720" r="3"/>
    <circle cx="400" cy="720" r="3"/>
    <circle cx="460" cy="700" r="3"/>
  </g>

  <text x="300" y="405" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">IIITB // MCU</text>
  <text x="300" y="770" fill="#ffffff" fill-opacity="0.4" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">HARDWARE SILICON // 02</text>
</svg>
