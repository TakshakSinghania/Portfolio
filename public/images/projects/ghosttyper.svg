<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gtBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E0D"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="beigeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E7E0D2"/>
      <stop offset="100%" stop-color="#A89F91"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#gtBgGrad)"/>

  <!-- Subtle Beige Architectural Grid -->
  <g stroke="#E7E0D2" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Top System Bar -->
  <rect x="40" y="35" width="720" height="44" rx="6" fill="#151412" stroke="#E7E0D2" stroke-opacity="0.15"/>
  <circle cx="65" cy="57" r="4" fill="#E7E0D2"/>
  <text x="80" y="61" fill="#F5F3EE" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.5">GHOSTTYPER PRO // CADENCE &amp; SYNTHESIS ENGINE</text>
  <text x="590" y="61" fill="#A89F91" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1">ZERO-CLIPBOARD / WEBSOCKET</text>

  <!-- Left: Keystroke Latency & Timing Jitter Engine -->
  <rect x="40" y="100" width="440" height="350" rx="8" fill="#121110" stroke="#E7E0D2" stroke-opacity="0.1"/>
  <text x="65" y="132" fill="#A89F91" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">HUMAN CADENCE GAUSSIAN DISTRIBUTION</text>

  <!-- Timing Jitter Curve -->
  <path d="M 65 310 C 130 310, 180 300, 220 220 C 250 160, 280 160, 310 220 C 350 300, 400 310, 455 310" fill="none" stroke="#E7E0D2" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="265" cy="180" r="5" fill="#E7E0D2"/>
  <text x="280" y="185" fill="#F5F3EE" font-family="ui-monospace, monospace" font-size="10" font-weight="700">μ = 85ms (KEYSTROKE DWELL)</text>

  <!-- Live Keystroke Stream Terminal -->
  <rect x="65" y="340" width="390" height="85" rx="4" fill="#0A0908" stroke="#E7E0D2" stroke-opacity="0.1"/>
  <text x="80" y="365" fill="#E7E0D2" font-family="ui-monospace, monospace" font-size="10" font-weight="700">&gt; inject_keystroke(&quot;const buffer = new Uint8Array()&quot;)</text>
  <text x="80" y="385" fill="#A89F91" font-family="ui-monospace, monospace" font-size="9">&gt; cadence_jitter: +14.2ms | inter_key_delay: 72ms | jitter: gaussian</text>
  <text x="80" y="405" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9">&gt; [OK] active target tab: VSCode Web / Chrome OS (zero clipboard)</text>

  <!-- Right: Control Board Specs -->
  <rect x="500" y="100" width="260" height="350" rx="8" fill="#121110" stroke="#E7E0D2" stroke-opacity="0.1"/>
  <text x="525" y="132" fill="#A89F91" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">ENGINE TELEMETRY</text>

  <!-- Spec Badges -->
  <g transform="translate(525, 155)">
    <rect x="0" y="0" width="210" height="50" rx="4" fill="#181715" stroke="#E7E0D2" stroke-opacity="0.12"/>
    <text x="15" y="22" fill="#A89F91" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.5">SYNTHESIS METHOD</text>
    <text x="15" y="39" fill="#F5F3EE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">OS NATIVE HARDWARE DISPATCH</text>
  </g>

  <g transform="translate(525, 220)">
    <rect x="0" y="0" width="210" height="50" rx="4" fill="#181715" stroke="#E7E0D2" stroke-opacity="0.12"/>
    <text x="15" y="22" fill="#A89F91" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.5">CLIPBOARD INTEGRITY</text>
    <text x="15" y="39" fill="#F5F3EE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ZERO CLIPBOARD OVERWRITE</text>
  </g>

  <g transform="translate(525, 285)">
    <rect x="0" y="0" width="210" height="50" rx="4" fill="#181715" stroke="#E7E0D2" stroke-opacity="0.12"/>
    <text x="15" y="22" fill="#A89F91" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.5">STREAM TRANSPORT</text>
    <text x="15" y="39" fill="#F5F3EE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WS FULL-DUPLEX DAEMON</text>
  </g>

  <g transform="translate(525, 350)">
    <rect x="0" y="0" width="210" height="50" rx="4" fill="#181715" stroke="#E7E0D2" stroke-opacity="0.12"/>
    <text x="15" y="22" fill="#A89F91" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.5">SECURITY STATUS</text>
    <text x="15" y="39" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ANTI-DETECTION SAFE</text>
  </g>
</svg>
