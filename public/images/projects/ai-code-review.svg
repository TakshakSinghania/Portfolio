<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiReviewBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a0f"/>
      <stop offset="100%" stop-color="#050406"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#aiReviewBg)"/>

  <!-- Top System Bar -->
  <rect x="40" y="30" width="720" height="42" rx="6" fill="#14111a" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="65" cy="51" r="4" fill="#f59e0b"/>
  <text x="80" y="55" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.5">AI CODE REVIEW PLATFORM</text>
  <rect x="580" y="41" width="165" height="20" rx="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="662" y="55" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CONCEPT / IN DEVELOPMENT</text>

  <!-- Left Side: AST Semantic Diff Analysis -->
  <rect x="40" y="90" width="460" height="360" rx="8" fill="#121018" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="65" y="122" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">GITHUB PR DIFF &amp; AST PARSER</text>

  <!-- Code Block Window -->
  <g transform="translate(65, 140)">
    <rect x="0" y="0" width="410" height="200" rx="6" fill="#08070c" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <text x="15" y="25" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">@@ -42,7 +42,9 @@ export async function processPayment</text>
    
    <!-- Code Lines -->
    <text x="15" y="50" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10">  const tx = await db.transaction();</text>
    <rect x="10" y="60" width="390" height="20" fill="#ef4444" fill-opacity="0.15"/>
    <text x="15" y="74" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">- const order = await tx.orders.update(id);</text>
    
    <rect x="10" y="85" width="390" height="36" fill="#10b981" fill-opacity="0.15"/>
    <text x="15" y="100" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10">+ const order = await tx.orders.findUnique({</text>
    <text x="15" y="115" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10">+   where: { id }, lock: 'for_update'</text>
    
    <!-- Inline AI Review Comment -->
    <g transform="translate(10, 130)">
      <rect x="0" y="0" width="390" height="58" rx="4" fill="#1e1829" stroke="#a855f7" stroke-opacity="0.4"/>
      <circle cx="20" cy="20" r="3" fill="#a855f7"/>
      <text x="32" y="24" fill="#a855f7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">AI Code Reviewer (Automated Security Heuristic)</text>
      <text x="32" y="44" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="9">Good catch enforcing SELECT FOR UPDATE to prevent race conditions.</text>
    </g>
  </g>

  <!-- Concept Pipeline Steps -->
  <g transform="translate(65, 360)">
    <rect x="0" y="0" width="410" height="65" rx="4" fill="#171420" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="15" y="25" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">TARGET WORKFLOW</text>
    <text x="15" y="48" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="600">GitHub PR → Webhook → Babel AST Parser → Gemini API Review</text>
  </g>

  <!-- Right Side: Heuristic Scanners & Specs -->
  <rect x="520" y="90" width="240" height="360" rx="8" fill="#121018" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="540" y="122" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">SECURITY HEURISTICS</text>

  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#1a1624" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">DIFF PARSER</text>
    <text x="12" y="40" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AST Structural Trees</text>
  </g>

  <g transform="translate(540, 205)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#1a1624" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">TARGET LATENCY</text>
    <text x="12" y="40" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" font-weight="700">&lt;10s per Pull Request</text>
  </g>

  <g transform="translate(540, 270)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#1a1624" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">OUTPUT FORMAT</text>
    <text x="12" y="40" fill="#a855f7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Structured JSON Lints</text>
  </g>

  <g transform="translate(540, 335)">
    <rect x="0" y="0" width="200" height="90" rx="4" fill="#08070c" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">STATUS NOTE</text>
    <text x="12" y="45" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Concept / In Active R&amp;D</text>
    <text x="12" y="65" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8.5">Not presented as finished system</text>
  </g>
</svg>
