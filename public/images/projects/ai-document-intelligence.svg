<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiDocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#aiDocBg)"/>

  <!-- Top System Bar -->
  <rect x="40" y="30" width="720" height="42" rx="6" fill="#0f141c" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="65" cy="51" r="4" fill="#38bdf8"/>
  <text x="80" y="55" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.5">AI DOCUMENT INTELLIGENCE</text>
  <rect x="580" y="41" width="165" height="20" rx="3" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="662" y="55" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CONCEPT / IN DEVELOPMENT</text>

  <!-- Left: Hybrid Vector & Lexical Pipeline Diagram -->
  <rect x="40" y="90" width="460" height="360" rx="8" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="65" y="122" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">HYBRID RAG RETRIEVAL ARCHITECTURE</text>

  <!-- Flow Visual -->
  <g transform="translate(65, 140)">
    <!-- Document Input -->
    <rect x="0" y="0" width="120" height="50" rx="4" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="60" y="24" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">TECHNICAL RFC</text>
    <text x="60" y="40" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">MARKDOWN &amp; PDF</text>

    <!-- Arrow -->
    <line x1="120" y1="25" x2="145" y2="25" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="145,22 152,25 145,28" fill="#38bdf8"/>

    <!-- Chunking -->
    <rect x="155" y="0" width="115" height="50" rx="4" fill="#161b22" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="212" y="24" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">HIERARCHICAL</text>
    <text x="212" y="40" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">CHUNKING</text>

    <!-- Arrow -->
    <line x1="270" y1="25" x2="295" y2="25" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <polygon points="295,22 302,25 295,28" fill="#ffffff" fill-opacity="0.3"/>

    <!-- Embeddings -->
    <rect x="305" y="0" width="105" height="50" rx="4" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
    <text x="357" y="24" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">PGVECTOR</text>
    <text x="357" y="40" fill="#10b981" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">1536-D DENSE</text>
  </g>

  <!-- Query Reciprocal Rank Fusion Box -->
  <g transform="translate(65, 210)">
    <rect x="0" y="0" width="410" height="120" rx="6" fill="#080b0f" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="15" y="24" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">QUERY: &quot;What is the row lock timeout in payment engine?&quot;</text>
    
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="180" height="32" rx="3" fill="#161b22"/>
      <text x="10" y="16" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8">BM25 LEXICAL RECALL</text>
      <text x="10" y="27" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Exact keyword: &quot;timeout&quot;</text>

      <rect x="200" y="0" width="180" height="32" rx="3" fill="#161b22"/>
      <text x="10" y="16" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8">PGVECTOR DENSE RECALL</text>
      <text x="10" y="27" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Cosine proximity: 0.892</text>
    </g>

    <text x="15" y="96" fill="#10b981" font-family="ui-monospace, monospace" font-size="9">> Reciprocal Rank Fusion (RRF): Top citation from RFC-402, §3.4</text>
  </g>

  <g transform="translate(65, 350)">
    <rect x="0" y="0" width="410" height="75" rx="4" fill="#131922" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="15" y="24" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">ATTRIBUTION MECHANISM</text>
    <text x="15" y="44" fill="#ffffff" font-family="ui-monospace, monospace" font-size="10" font-weight="600">Byte-offset source citation with exact line-range anchors</text>
  </g>

  <!-- Right: Technical RAG Specs -->
  <rect x="520" y="90" width="240" height="360" rx="8" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="540" y="122" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1">HYBRID SPECS</text>

  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">VECTOR DATABASE</text>
    <text x="12" y="40" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">pgvector + HNSW</text>
  </g>

  <g transform="translate(540, 205)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">LEXICAL SEARCH</text>
    <text x="12" y="40" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">PostgreSQL tsvector</text>
  </g>

  <g transform="translate(540, 270)">
    <rect x="0" y="0" width="200" height="55" rx="4" fill="#161b22" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="22" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="9">ASYNC INGESTION</text>
    <text x="12" y="40" fill="#10b981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Worker Chunk Queue</text>
  </g>

  <g transform="translate(540, 335)">
    <rect x="0" y="0" width="200" height="90" rx="4" fill="#080b0f" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="12" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">STATUS NOTE</text>
    <text x="12" y="45" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Concept / In Active R&amp;D</text>
    <text x="12" y="65" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8.5">Not presented as finished system</text>
  </g>
</svg>
